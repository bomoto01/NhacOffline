<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhạc Offline - SoundCloud Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Nhạc Offline</h1>
          <span class="subtext">SoundCloud Auto Sync</span>
        </div>
      </div>
      <div id="statusDot" class="status-badge online" title="Máy chủ sẵn sàng">
        <span class="dot"></span>
        <span id="statusText">Kết nối</span>
      </div>
    </header>

    <!-- Controls -->
    <section class="section-settings">
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-label">Tự động đồng bộ bài nghe</span>
          <span class="setting-desc">Đồng bộ tức thì bài đang nghe trên SoundCloud</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleAutoSync" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-input-group">
        <label for="backendUrlInput">Địa chỉ máy chủ (Backend):</label>
        <div class="input-with-button">
          <input type="text" id="backendUrlInput" value="http://localhost:8080" placeholder="http://localhost:8080">
          <button id="btnSaveUrl" class="btn-sm">Lưu</button>
        </div>
      </div>
    </section>

    <!-- Recent Synced Tracks -->
    <section class="section-recent">
      <div class="section-title">
        <span>Bài hát vừa đồng bộ</span>
        <button id="btnClearHistory" class="btn-link" title="Xóa lịch sử">Xóa</button>
      </div>
      <div id="recentList" class="recent-list">
        <!-- Render bằng popup.js -->
        <div class="empty-hint">Chưa có bài hát nào được đồng bộ trong phiên này. Hãy mở SoundCloud và nghe thử một bài nhé!</div>
      </div>
    </section>

    <!-- Footer Action -->
    <footer class="popup-footer">
      <button id="btnOpenWebApp" class="btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
        Mở Web Nhạc Offline
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
